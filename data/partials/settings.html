<section id="settings" class="page">

  <div class="card mb-3">

    <div class="card-header bg-secondary text-white">
      <h5 class="mb-0" data-i18n="nav.settings">Settings</h5>
    </div>

    <div class="card-body">

      <!-- LANGUAGE: flag buttons drawn by i18n.js; hidden until local.json is loaded -->
      <div class="card mb-3" style="display:none">
        <div class="card-header">
          <strong data-i18n="lang.title">Language</strong>
        </div>
        <div class="card-body">
          <div class="lang-flags" id="lang-flags"></div>
        </div>
      </div>

      <!-- AP SECTION -->
      <div class="card mb-3">
        <div class="card-header">
          <strong data-i18n="set.ap_title">Access Point (AP)</strong>
          <small class="text-muted d-block" data-i18n="set.ap_sub">The farm's own Wi-Fi network</small>
        </div>
        <div class="card-body">

          <div class="form-group">
            <label for="ap-ssid" data-i18n="set.ssid">Network Name (SSID)</label>
            <input type="text" class="form-control" id="ap-ssid"
                   maxlength="32" placeholder="MiniFarm-XXXXXX">
          </div>

          <div class="form-group">
            <label for="ap-pass" data-i18n="set.ap_pass">Password (WPA2)</label>
            <div class="input-group">
              <input type="password" class="form-control" id="ap-pass"
                     autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"
                     maxlength="64" placeholder="Leave blank to keep current" data-i18n-ph="set.pass_keep_ph">
              <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="button"
                        id="ap-pass-toggle" tabindex="-1">👁</button>
              </div>
            </div>
            <small class="text-muted" data-i18n="set.pass_min">Minimum 8 characters</small>
          </div>

          <div class="small text-muted" id="ap-address-line" style="display:none">
            <span data-i18n="set.farm_address">Farm network address:</span> <strong id="ap-address"></strong>
            <span id="ap-moved-note" style="display:none" data-i18n="set.address_moved">(moved, because your home network uses 192.168.4.x)</span>
          </div>

        </div>
      </div>

      <!-- STA SECTION -->
      <div class="card mb-3">
        <div class="card-header">
          <strong data-i18n="set.sta_title">Home Network (STA)</strong>
          <small class="text-muted d-block" data-i18n="set.sta_sub">Connect to existing Wi-Fi router</small>
        </div>
        <div class="card-body">

          <div class="form-group">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="sta-ssid" class="mb-0" data-i18n="set.ssid">Network Name (SSID)</label>
              <span id="sta-saved-badge" class="badge badge-success" style="display:none!important">Saved</span>
            </div>
            <div class="input-group">
              <input type="text" class="form-control" id="sta-ssid"
                     maxlength="32" placeholder="Home network SSID" data-i18n-ph="set.sta_ssid_ph">
              <div class="input-group-append">
                <button class="btn btn-outline-info btn-sm" type="button" id="wifi-scan-btn" data-i18n="set.scan">Scan</button>
              </div>
            </div>
          </div>

          <div id="wifi-scan-results" style="display:none" class="mb-3">
            <label data-i18n="set.found">Found networks:</label>
            <div id="wifi-scan-list" class="list-group list-group-flush" style="max-height:180px;overflow-y:auto"></div>
          </div>

          <div class="form-group">
            <label for="sta-pass" data-i18n="set.password">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="sta-pass"
                     autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"
                     maxlength="64" placeholder="Leave blank to keep current" data-i18n-ph="set.pass_keep_ph">
              <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="button"
                        id="sta-pass-toggle" tabindex="-1">👁</button>
              </div>
            </div>
          </div>

          <!-- Where the farm is in the home network -->
          <div id="home-status" class="alert alert-light border small" style="display:none"></div>

          <!-- IP settings: automatic by default, manual for those who manage their router -->
          <div class="mb-3">
            <a href="#" class="small dash-fold collapsed d-inline-flex" data-toggle="collapse" data-target="#ip-settings"
               role="button" aria-expanded="false" aria-controls="ip-settings" id="ip-settings-toggle">
              <span class="mr-2" data-i18n="set.ip">IP settings</span><span class="dash-chevron" aria-hidden="true"></span>
            </a>
            <div id="ip-settings" class="collapse">
              <div class="pt-2">
                <div class="custom-control custom-radio custom-control-inline">
                  <input type="radio" id="ip-mode-auto" name="ip-mode" value="auto" class="custom-control-input" checked>
                  <label class="custom-control-label" for="ip-mode-auto" data-i18n="set.ip_auto">Automatic</label>
                </div>
                <div class="custom-control custom-radio custom-control-inline">
                  <input type="radio" id="ip-mode-manual" name="ip-mode" value="manual" class="custom-control-input">
                  <label class="custom-control-label" for="ip-mode-manual" data-i18n="set.ip_manual">Manual</label>
                </div>
                <small class="text-muted d-block mt-1 mb-2" id="ip-mode-hint" data-i18n="set.ip_auto_hint">
                  The farm takes a free address .200–.249 in your network and keeps it.
                </small>
                <div class="ip-grid">
                  <label for="ip-addr" data-i18n="set.address">Address</label>
                  <input type="text" class="form-control form-control-sm ip-field" id="ip-addr" inputmode="decimal" placeholder="192.168.1.210" autocomplete="off">
                  <label for="ip-mask" data-i18n="set.mask">Mask</label>
                  <input type="text" class="form-control form-control-sm ip-field" id="ip-mask" inputmode="decimal" placeholder="255.255.255.0" autocomplete="off">
                  <label for="ip-gw" data-i18n="set.gateway">Gateway</label>
                  <input type="text" class="form-control form-control-sm ip-field" id="ip-gw" inputmode="decimal" placeholder="192.168.1.1" autocomplete="off">
                  <label for="ip-dns1">DNS 1</label>
                  <input type="text" class="form-control form-control-sm ip-field" id="ip-dns1" inputmode="decimal" placeholder="router" data-i18n-ph="set.router_ph" autocomplete="off">
                  <label for="ip-dns2">DNS 2</label>
                  <input type="text" class="form-control form-control-sm ip-field" id="ip-dns2" inputmode="decimal" placeholder="optional" data-i18n-ph="set.optional_ph" autocomplete="off">
                </div>
                <small class="text-muted d-block mt-2" id="ip-reserve-hint" style="display:none"></small>
              </div>
            </div>
          </div>

          <div id="sta-disconnect-row" style="display:none">
            <button class="btn btn-outline-danger btn-sm" id="sta-disconnect-btn" data-i18n="set.disconnect">Disconnect from home network</button>
          </div>

        </div>
      </div>

      <!-- STATUS -->
      <div id="settings-status" class="alert" style="display:none"></div>

      <!-- SAVE -->
      <button class="btn btn-primary btn-block" id="settings-save-btn" data-i18n="set.save_restart">Save &amp; Restart</button>

    </div>
  </div>

</section>
