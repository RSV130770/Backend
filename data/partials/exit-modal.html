<!-- Exit confirmation -->
<div id="exitModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exit-title">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exit-title">Leave control panel?</h5>
      </div>
      <div class="modal-body">
        The farm keeps running on its schedule. Your control session will be released.
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="exit-stay-btn">Stay</button>
        <button class="btn btn-danger" id="exit-leave-btn">Leave</button>
      </div>
    </div>
  </div>
</div>
