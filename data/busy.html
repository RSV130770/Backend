<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="fw.busy_title">Device is busy</title>
<!--
  Shown by the controller (/busy) while another user holds the control
  session. Stand-alone: no jQuery, no app.js.
  Texts: English here, translated from /local.json (fw.* keys) in the
  farm's language (/api/lang); never chosen -> the phone's language.
  Polls /api/session and opens the control panel as soon as it is free.
-->
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;
       min-height:100vh;margin:0;background:#f0f4f8;}
  .card{background:#fff;border-radius:12px;
        box-shadow:0 4px 24px rgba(0,0,0,.10);
        padding:2rem;width:min(320px,90vw);text-align:center;}
  h2{font-size:1.1rem;color:#1a1a2e;margin:.5rem 0 1.25rem;}
  .spin{width:48px;height:48px;margin:0 auto;border:5px solid #d6e4f5;
        border-top-color:#007bff;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  p{font-size:.85rem;color:#666;margin-top:1rem;}
</style>
</head>
<body>
<div class="card">
  <h2 data-i18n="fw.busy_title">Device is busy</h2>
  <div class="spin" role="status" aria-label="Waiting"></div>
  <p><span data-i18n="fw.busy_text">Another user is controlling the device.</span><br>
     <span data-i18n="fw.busy_wait">The control panel opens automatically when it is free.</span></p>
</div>
<script>
// Texts in the farm's language; a missing file keeps the English above
function translate() {
  const texts = fetch('/local.json').then(r => r.ok ? r.json() : null).catch(() => null);
  const farm = fetch('/api/lang', {cache: 'no-store'}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  Promise.all([texts, farm]).then(([d, f]) => {
    if (!d || !d.text) return;
    const codes = (d.languages || []).map(l => l.code);
    let lang = f && f.lang;
    if (!codes.includes(lang)) {
      const wanted = navigator.languages || [navigator.language || ''];
      lang = wanted.map(l => String(l).slice(0, 2).toLowerCase()).find(c => codes.includes(c)) ||
             d.default || 'en';
    }
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const e = d.text[el.getAttribute('data-i18n')];
      if (e && e[lang]) el.textContent = e[lang];
    });
  });
}

function poll() {
  fetch('/api/session', {cache: 'no-store'}).then(r => r.json()).then(d => {
    if (!d.busy) { location.replace('/'); return; }
    setTimeout(poll, 2000);
  }).catch(() => setTimeout(poll, 3000));
}

translate();
poll();
</script>
</body>
</html>
